name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          mkdir -p build_project
          unzip -q creator_studio_v2.zip -d build_project

      - name: Create Android project
        working-directory: build_project/creator_studio_mvp
        run: flutter create --platforms=android .

      - name: Install packages
        working-directory: build_project/creator_studio_mvp
        run: flutter pub get

      - name: Build APK
        working-directory: build_project/creator_studio_mvp
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Capcut-Angad-APK
          path: build_project/creator_studio_mvp/build/app/outputs/flutter-apk/app-release.apk
